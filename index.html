<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <script src="page-recherche.js" type="module"></script>
    <title>DevScope applocation</title>
</head>

<body class="bg-[#0F172A] text-white min-h-screen">

    <!-- start the header -->
    <header class="fixed top-0 left-0 w-full z-50 ">
        <div class="header-container w-[90%] mx-auto my-4 flex justify-between items-center px-5 h-[50px] bg-[#082F49] border-b border-gray-500
                max-[767px]:flex-wrap max-[767px]:h-auto max-[767px]:px-2 max-[767px]:py-2 rounded-full">
            <!-- Logo -->
            <div class="logo flex gap-2 items-center shrink-0">
                <a href="./index.html">
                    <img src="./img/logo.png" alt="logo" class="w-[30px] h-[30px] rounded-full">
                </a>
                <a href="./index.html">
                    <p class="text-gray-50 font-bold max-[767px]:hidden">DeveScope</p>
                </a>

            </div>
            <!-- Navigation -->
            <nav class="navbar h-[40px] flex items-center text-white">
                <ul class="h-full w-[300px] flex flex-wrap items-center justify-around  rounded-xl
                       max-[767px]:w-auto ">
                    <li class="active text-xs text-[#22D3EE] rounded-lg px-6 py-2 font-semibold hover:bg-slate-800">
                        <a href="index.html">Recherche</a>
                    </li>
                    <li class="rounded-lg px-6 py-2 font-semibold  text-xs hover:bg-slate-800">
                        <a href="shortlist.html">Shortlist</a>
                    </li>

                </ul>
            </nav>
        </div>
    </header>
    <!-- end header -->

    <!-- start main section -->

    <main class="min-h-screen bg-[#0F172A] text-white pt-[60px] max-[767px]:pt-[100px] ">

        <div
            class="recherch-page mx-auto flex justify-center items-center max-w-[1600px] flex-col gap-10 px-4 py-6 md:px-8 ">
            <section class="info text-white h-[80%] text-center">
                <h1 class="text-white text-6xl font-semibold ">
                    <span>Trouver les meilleurs <br></span>
                    <span>dévloppeurs grace a <span class="text-fuchsia-700"> leur </span> <br> </span>
                    <span class="text-cyan-400">code</span>
                </h1>
                <br>
                <p>anlysez un <span class="text-cyan-400 font-semibold">profil</span>,ses <span
                        class="text-fuchsia-700">projets</span> et ses <span class="text-lime-400">langages</span>
                    en <br> quelques secondes </p>
            </section>
            <form class="serch-bar w-[50%] flex flex-col">
                <div class=" flex flex-1 items-center rounded-full border-slate-600 bg-[#082F49] min-h-12 px-4">
                    <i class="fa-solid fa-magnifying-glass mx-2"></i>
                    <input type="search" id="search-profile" name="search-profile"
                        class="h-full w-full bg-transparent text-white outline-none placeholder:text-slate-500"
                        placeholder="   entrer un nom de utilisateur...">
                    <button type="submit"
                        class="bg-linear-to-t from-sky-500 to-indigo-500 w-[100px] h-[30px] rounded-xl hover:scale-105">analyser</button>


                </div>
                <p id="profile-err" class="message mt-1 text-sm text-red-400 self-center"></p>

            </form>

        </div>

    </main>
    <!-- end main section -->


</body>

</html>
