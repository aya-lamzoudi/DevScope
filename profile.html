<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <script src="page-profile.js" type="module"></script>

    <title>DevScope application</title>
</head>

<body class="bg-[#0F172A] text-white min-h-screen">

    <!-- start the header -->
    <header class="fixed top-0 left-0 w-full z-50 ">
        <div class="header-container w-[90%] mx-auto my-4 flex justify-between items-center px-5 h-[50px] bg-[#082F49] border-b border-gray-500
                max-[767px]:flex-wrap max-[767px]:h-auto max-[767px]:px-2 max-[767px]:py-2 rounded-full">
            <!-- Logo -->
            <div class="logo flex gap-2 items-center shrink-0">
                <img src="./img/logo.png" alt="logo" class="w-[30px] h-[30px] rounded-full">
                <a href="./index.html">
                    <p class="text-gray-50 font-bold max-[767px]:hidden">DeveScope</p>
                </a>
            </div>
            <!-- Navigation -->
            <nav class="navbar h-[40px] flex items-center text-white">
                <ul class="h-full w-[300px] flex flex-wrap items-center justify-around  rounded-xl
                       max-[767px]:w-auto ">
                    <li class="active text-xs text-[#22D3EE] rounded-lg px-6 py-2 font-semibold hover:bg-slate-800">
                        <a href="index.html">Recherche</a>
                    </li>
                    <li class="rounded-lg px-6 py-2 font-semibold  text-xs hover:bg-slate-800">
                        <a href="shortlist.html">Shortlist</a>
                    </li>

                </ul>
            </nav>
        </div>
    </header>
    <!-- end header -->


    <!-- START MAIN -->
    <main class="min-h-screen bg-[#0F172A] text-white pt-[60px] max-[767px]:pt-[100px]">

        <div class="profile-page mx-auto flex justify-center  max-w-[1600px] flex-col gap-10 px-4 py-6 md:px-8 ">


            
        </div>

    </main>
    <!-- END MAIN -->
    <template>
        <!-- SEARCH BAR -->
        <form class="serch-bar w-[50%] flex flex-col self-center">
            <div class=" flex flex-1 items-center rounded-full border-slate-600 bg-[#082F49] min-h-12 px-4">
                <i class="fa-solid fa-magnifying-glass mx-2"></i>
                <input type="search" id="search-profile" name="search-profile"
                    class="h-full w-full bg-transparent text-white outline-none placeholder:text-slate-500"
                    placeholder="   entrer un nom de utilisateur...">
                <button type="submit"
                    class="bg-linear-to-t from-sky-500 to-indigo-500 w-[100px] h-[30px] rounded-xl hover:scale-105">analyser</button>


            </div>
            <p id="profile-err" class="message mt-1 text-sm text-red-400 self-center"></p>

        </form>


        <!-- PROFILE AND REPOSITORIES -->
        <section class="grid grid-cols-1 lg:grid-cols-[345px_1fr] gap-6 items-start">

            <!-- PROFILE CARD -->
            <div class="profile-card bg-[#082F49]/70 border border-slate-600/40
                    rounded-3xl p-6 shadow-xl flex flex-col items-center">


                <!-- profile img -->
                <div
                    class="w-[125px] h-[125px] rounded-full p-1 bg-gradient-to-br from-[#22D3EE] to-[#0E7490] shadow-lg shadow-cyan-500/20 mb-5">
                    <img id="profile-avatar" src="./img/logo.png" alt="profile photo" class="w-full h-full rounded-full
                         border-4 border-[#082F49]">

                </div>


                <!-- full NAME -->
                <h1 id="profile-name" class="text-2xl font-bold text-center text-white mb-1">
                    Fullname
                </h1>

                <!-- USERNAME -->
                <a id="profile-username" href="#" class="text-[#22D3EE] font-semibold
                        text-sm mb-3">
                    @username
                </a>

                <!-- BIO -->
                <p id="profile-bio" class="text-slate-300 text-sm text-center mb-5">
                    bio
                </p>

                <!-- localisation & date -->
                <div class="w-full bg-[#0F172A]/70 rounded-2xl p-4 space-y-3 mb-5">

                    <!-- location -->
                    <div class="flex items-center gap-3 text-slate-300 text-sm">

                        <i class="fa-solid fa-location-dot text-[#22D3EE]"></i>
                        <span id="profile-location"> Location </span>

                    </div>

                    <!-- daate -->
                    <div class="flex items-center gap-3 text-slate-300 text-sm">
                        <i class="fa-regular fa-calendar text-[#22D3EE]"></i>
                        Membre depuis ...
                        <span id="profile-date"> date here </span>

                    </div>

                </div>


                <!-- statistiques -->
                <div class="grid grid-cols-3 gap-2 w-full mb-5">
                    <!-- depo nbr -->
                    <div class="bg-[#0F172A]/70 rounded-xl p-3 text-center">

                        <h3 id="profile-repos" class="text-2xl font-bold text-[#22D3EE]">
                            0
                        </h3>

                        <p class="text-[10px] uppercase
                                text-slate-400 font-semibold">
                            Dépôts
                        </p>

                    </div>

                    <!-- abboner nbr -->
                    <div class="bg-[#0F172A]/70 rounded-xl p-3 text-center">

                        <h3 id="profile-followers" class="text-2xl font-bold text-[#38BDF8]">
                            0
                        </h3>

                        <p class="text-[10px] uppercase
                                text-slate-400 font-semibold">
                            Abonnés
                        </p>

                    </div>

                    <!-- abbonment nbr -->
                    <div class="bg-[#0F172A]/70 rounded-xl p-3 text-center">

                        <h3 id="profile-following" class="text-2xl font-bold text-[#A5F3FC]">
                            0
                        </h3>

                        <p class="text-[10px] uppercase
                                text-slate-400 font-semibold">
                            Abonnements
                        </p>

                    </div>

                </div>


                <!-- shortlist btn  -->
                <button id="add-shortlist" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#0891B2] to-[#22D3EE] text-[#082F49]
                        font-bold text-sm hover:scale-[1.02] shadow-lg mb-3">

                    <i class="fa-solid fa-star mr-2"></i>
                    Ajouter à la shortlist

                </button>


                <!-- ORIGINAL PROFILE -->
                <a id="profile-link" href="#" target="_blank"
                    class="w-full text-center py-3
                        rounded-xl border border-slate-600/60 text-[#22D3EE] text-sm font-semibold hover:bg-[#0F172A] transition">

                    Voir le profil original
                    <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>

                </a>

            </div>


            <!-- REPO SECTION -->
            <div class="repo-section bg-[#082F49]/40 border border-slate-600/40 rounded-3xl p-5 md:p-7 shadow-xl">

                <!-- TITLE -->
                <div class="flex items-center gap-3 mb-6">
                    <h2 class="text-2xl font-bold text-white"> Dépots </h2>

                    <span id="repos-count"
                        class="bg-[#0E7490]/40 text-[#22D3EE] text-xs font-bold px-3 py-1 rounded-full">
                        0
                    </span>

                </div>


                <!-- repos info -->
                <div id="repos-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">


                    <!-- REPOSITORY CARD 1 -->
                    <article class=" bg-[#0F172A]/80 border border-slate-700 rounded-2xl p-5 hover:border-[#22D3EE]/60">

                        <div class="flex items-center gap-2 mb-4">
                            <i class="fa-regular fa-square text-[#22D3EE]"></i>

                            <h3 class="repo-name font-bold text-white"> name of the repo </h3>

                        </div>

                        <p class="repo-description text-sm mb-4">
                            Aucune description.
                        </p>

                        <div class="repo-about flex flex-wrap items-center gap-4 text-xs text-slate-300">

                            <span class="repo-lang">
                                <i class="fa-solid fa-circle text-[7px]"></i>
                                HTML
                            </span>

                            <span class="repo-stars text-yellow-400">
                                <i class="fa-solid fa-star"></i>
                                0
                            </span>

                            <span class="repo-forks text-[#22D3EE]">
                                <i class="fa-solid fa-code-fork"></i>
                                0
                            </span>

                        </div>

                        <p class="last-update text-slate-500 text-xs mt-4">
                            last update "date"
                        </p>

                    </article>

                    <article class="bg-[#0F172A]/80 border border-slate-700 rounded-2xl p-5 hover:border-[#22D3EE]/60">

                        <div class="flex items-center gap-2 mb-4">
                            <i class="fa-regular fa-square text-[#22D3EE]"></i>

                            <h3 class="repo-name font-bold text-white"> name of the repo </h3>

                        </div>

                        <p class="repo-description text-sm mb-4">
                            Aucune description.
                        </p>

                        <div class="repo-about flex flex-wrap items-center gap-4 text-xs text-slate-300">

                            <span class="repo-lang">
                                <i class="fa-solid fa-circle text-[7px]"></i>
                                HTML
                            </span>

                            <span class="repo-stars text-yellow-400">
                                <i class="fa-solid fa-star"></i>
                                0
                            </span>

                            <span class="repo-forks text-[#22D3EE]">
                                <i class="fa-solid fa-code-fork"></i>
                                0
                            </span>

                        </div>

                        <p class="last-update text-slate-500 text-xs mt-4">
                            last update "date"
                        </p>

                    </article>

                </div>


                <!-- si there is no repo -->
                <div id="repos-empty" class="hidden text-center py-10">

                    <i class="fa-regular fa-folder-open
                            text-4xl text-[#22D3EE] mb-4"></i>

                    <p class="text-slate-300">
                        Aucun dépôt trouvé
                    </p>

                </div>

            </div>

        </section>
    </template>
</body>

</html>
