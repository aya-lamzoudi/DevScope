<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>DevScope applocation</title>
</head>

<body>
    <!-- start the header -->
    <header class="fixed top-0 left-0 w-full z-50 ">
        <div class="header-container w-[90%] mx-auto my-4 flex justify-between items-center px-5 h-[50px] bg-[#082F49] border-b border-gray-500
                max-[767px]:flex-wrap max-[767px]:h-auto max-[767px]:px-2 max-[767px]:py-2 rounded-full">
            <!-- Logo -->
            <div class="logo flex gap-2 items-center shrink-0">
                <img src="./img/logo.png" alt="logo" class="w-[30px] h-[30px] rounded-full">
                <a href="./index.html">
                    <p class="text-gray-50 font-bold max-[767px]:hidden">DeveScope</p>
                </a>
            </div>
            <!-- Navigation -->
            <nav class="navbar h-[40px] flex items-center text-white">
                <ul class="h-full w-[300px] flex flex-wrap items-center justify-around  rounded-xl
                       max-[767px]:w-auto ">
                    <li class="active text-xs  rounded-lg px-6 py-2 font-semibold hover:bg-slate-800">
                        <a href="index.html">Recherche</a>
                    </li>
                    <li class="rounded-lg px-6 py-2 font-semibold text-[#22D3EE] text-xs hover:bg-slate-800">
                        <a href="shortlist.html">Shortlist</a>
                    </li>

                </ul>
            </nav>
        </div>
    </header>
    <!-- end header -->

    <!-- start main section -->


    <!-- MAIN -->
    <main class="min-h-screen bg-[#0F172A] text-white pt-[60px] max-[767px]:pt-[100px] ">

        <div class="shortlist mx-auto max-w-[1600px] flex flex-col gap-7 px-4 py-6 md:px-8">

            <!-- TITLE -->
            <section class="flex flex-col gap-2">

                <h1 class="text-4xl font-bold text-[#22D3EE] max-[767px]:text-3xl">
                    Ma shortlist
                </h1>

                <p id="shortlist-count" class="text-sm text-slate-400">
                    0 candidat(s) dans votre shortlist
                </p>

            </section>



            <!-- CANDIDATES LIST -->
            <section id="devlopper-list" class="flex flex-col gap-4 w-full">

                <article class="devlopper-card flex gap-5 rounded-2xl border border-slate-700/60 bg-[#082F49]/60 p-5 px-6 md:px-8
                    md:flex-row md:items-center md:justify-between hover:border-[#22D3EE]/50 ">

                    <!-- developper details -->
                    <div class="devlopper-details flex min-w-0 items-center gap-5 md:gap-6">

                        <div class="logo shrink-0">
                            <img src="./img/logo.png" alt="candidate avatar"
                                class="w-[65px] h-[65px] rounded-full border-2 border-[#22D3EE]">
                        </div>

                        <div class="match-info min-w-0">

                            <h2 class="devlopper-name text-lg font-bold text-white">
                                Aya Lamzoudi
                            </h2>

                            <p class="devlopper-username mt-1 text-sm text-slate-400">
                                @aya-lamzoudi

                                <span
                                    class="lang rounded-lg bg-[#0E7490]/30 px-3 py-1 text-xs font-semibold text-[#22D3EE]">
                                    Java
                                </span>
                            </p>

                            <p class="devlopper-note mt-2 text-sm italic text-[#A5F3FC]">
                                Aucune note
                            </p>

                            <p class="devlopper-date mt-2 text-xs text-slate-500">
                                Ajouté le 13/05/2026
                            </p>

                        </div>
                    </div>


                    <!-- ACTIONS -->
                    <div class="user-actions flex flex-wrap items-center justify-end gap-3">

                        <div class="user-rate flex items-center">
                            <div class="rating flex gap-0.5
                                text-[#A3E635] text-lg">
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star-half-stroke"></i>
                                <i class="fa-regular fa-star"></i>
                            </div>
                        </div>

                        <button type="button"
                            class="status-btn rounded-xl border border-[#22D3EE]/50 bg-[#0891B2]/10 px-4 py-2 text-xs font-bold text-[#22D3EE] hover:bg-[#0891B2]/20">
                            <i class="fa-solid fa-circle text-[8px] mr-1"></i>
                            À contacter
                        </button>

                        <button type="button" class="edit-match-btn p-2 text-slate-400 hover:text-green-400"><i
                                class="fa-solid fa-pen" aria-hidden="true"></i></button>
                        <button type="button" class="delete-match-btn p-2 text-slate-400 hover:text-red-400"><i
                                class="fa-solid fa-trash-can" aria-hidden="true"></i></button>

                    </div>

                </article>

            </section>


            <!-- EMPTY STATE -->
            <div id="empty-shortlist" class="hidden flex-col items-center
                justify-center py-16 text-center">

                <i class="fa-regular fa-folder-open
                    text-5xl text-[#22D3EE] mb-4"></i>

                <h2 class="text-xl font-bold text-white">
                    Votre shortlist est vide
                </h2>

                <p class="text-sm text-slate-400 mt-2">
                    Ajoutez des candidats depuis la page Recherche.
                </p>

                <a href="index.html" class="mt-5 rounded-xl bg-[#0891B2]
                    px-6 py-3 text-sm font-bold text-white
                    hover:bg-[#0E7490] transition">
                    <i class="fa-solid fa-magnifying-glass mr-2"></i>
                    Rechercher des candidats
                </a>

            </div>

        </div>
    </main>



    <!-- end main section -->
</body>

</html>
